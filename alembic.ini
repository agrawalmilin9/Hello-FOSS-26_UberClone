# Alembic (database migrations). Run from the repo root:
#   alembic upgrade head                              apply all migrations
#   alembic revision --autogenerate -m "add x"        new migration from changes in backend/app/models.py
# The database URL comes from DATABASE_URL (see backend/app/config.py), not from this file.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
